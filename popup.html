<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
    <title>Seguidores - SBCL 🇧🇷</title>
  </head>
  <body>
    <header>
      <div>
        <h1>Seguidores - SBCL 🇧🇷</h1>
        <p id="credits">
          Desenvolvido por
          <a href="https://builder.aws.com/community/@jhermesn" target="_blank" rel="noreferrer">Jorge Hermes</a>
        </p>
      </div>
      <button id="run" type="button">Verificar</button>
    </header>

    <p id="status" role="status"></p>

    <section id="results" hidden>
      <div id="summary">
        <div class="stat"><b id="stat-roster"></b><span>na lista</span></div>
        <div class="stat"><b id="stat-follow-me"></b><span>te seguem</span></div>
        <div class="stat"><b id="stat-to-follow"></b><span>falta seguir</span></div>
      </div>

      <div class="group" data-key="followingMe" data-empty="Ninguém da lista te segue ainda.">
        <h2>SBCLs que me seguem <span class="count"></span></h2>
        <div class="toolbar">
          <div class="filters" role="group" aria-label="Filtrar">
            <button type="button" data-filter="all" aria-pressed="true">Todos</button>
            <button type="button" data-filter="ok" aria-pressed="false">OK</button>
            <button type="button" data-filter="x" aria-pressed="false">X</button>
          </div>
          <div class="pager">
            <button class="icon prev" type="button" aria-label="Página anterior">
              <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3 5 8l5 5" /></svg>
            </button>
            <span class="page"></span>
            <button class="icon next" type="button" aria-label="Próxima página">
              <svg viewBox="0 0 16 16" aria-hidden="true"><path d="m6 3 5 5-5 5" /></svg>
            </button>
          </div>
          <button class="icon open-all" type="button" title="Abrir a página atual em abas" aria-label="Abrir a página atual em abas">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M9 2h5v5M14 2 7 9M12 9.5V13a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h3.5" /></svg>
            <span class="badge"></span>
          </button>
          <button class="icon copy" type="button" title="Copiar a lista" aria-label="Copiar a lista">
            <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="5.5" y="5.5" width="8" height="9" rx="1.5" /><path d="M10.5 3.5v-1a1 1 0 0 0-1-1H3a1 1 0 0 0-1 1V10a1 1 0 0 0 1 1h1" /></svg>
          </button>
        </div>
        <ul class="people"></ul>
      </div>

      <div class="group" data-key="notFollowingMe" data-empty="Todo mundo da lista já te segue.">
        <h2>SBCLs que não me seguem <span class="count"></span></h2>
        <div class="toolbar">
          <div class="filters" role="group" aria-label="Filtrar">
            <button type="button" data-filter="all" aria-pressed="true">Todos</button>
            <button type="button" data-filter="ok" aria-pressed="false">OK</button>
            <button type="button" data-filter="x" aria-pressed="false">X</button>
          </div>
          <div class="pager">
            <button class="icon prev" type="button" aria-label="Página anterior">
              <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3 5 8l5 5" /></svg>
            </button>
            <span class="page"></span>
            <button class="icon next" type="button" aria-label="Próxima página">
              <svg viewBox="0 0 16 16" aria-hidden="true"><path d="m6 3 5 5-5 5" /></svg>
            </button>
          </div>
          <button class="icon open-all" type="button" title="Abrir a página atual em abas" aria-label="Abrir a página atual em abas">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M9 2h5v5M14 2 7 9M12 9.5V13a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h3.5" /></svg>
            <span class="badge"></span>
          </button>
          <button class="icon copy" type="button" title="Copiar a lista" aria-label="Copiar a lista">
            <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="5.5" y="5.5" width="8" height="9" rx="1.5" /><path d="M10.5 3.5v-1a1 1 0 0 0-1-1H3a1 1 0 0 0-1 1V10a1 1 0 0 0 1 1h1" /></svg>
          </button>
        </div>
        <ul class="people"></ul>
      </div>

      <div class="group" data-key="top" data-empty="Sem dados de seguidores.">
        <h2>
          Top seguidores <span class="count"></span>
          <button class="icon copy" type="button" title="Copiar a lista" aria-label="Copiar a lista" style="margin-left: auto">
            <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="5.5" y="5.5" width="8" height="9" rx="1.5" /><path d="M10.5 3.5v-1a1 1 0 0 0-1-1H3a1 1 0 0 0-1 1V10a1 1 0 0 0 1 1h1" /></svg>
          </button>
        </h2>
        <ul class="people"></ul>
      </div>

      <p id="legend">OK = você já segue &nbsp;·&nbsp; X = você ainda não segue</p>
      <p id="warnings"></p>
    </section>

    <template id="person">
      <li>
        <img alt="" />
        <div class="who"><strong></strong><span></span></div>
        <span class="mark"></span>
        <a target="_blank" rel="noreferrer" title="Abrir perfil" aria-label="Abrir perfil">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M9 2h5v5M14 2 7 9M12 9.5V13a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h3.5" /></svg>
        </a>
      </li>
    </template>

    <script type="module" src="popup.js"></script>
  </body>
</html>
