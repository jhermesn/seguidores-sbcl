<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
    <title>Seguidores - SBCL 🇧🇷</title>
  </head>
  <body>
    <header>
      <h1>Seguidores - SBCL 🇧🇷</h1>
      <p id="credits">
        Desenvolvido por
        <a href="https://builder.aws.com/community/@jhermesn" target="_blank" rel="noreferrer">Jorge Hermes</a>
      </p>
    </header>

    <button id="run" type="button">Verificar</button>

    <p id="status" role="status"></p>

    <section id="results" hidden>
      <div id="summary"></div>

      <h2>SBCLs que me seguem <span id="count-following-me" class="count"></span></h2>
      <div class="toolbar">
        <div class="filters" role="group" aria-label="Filtrar">
          <button type="button" data-section="followingMe" data-filter="all" aria-pressed="true">Todos</button>
          <button type="button" data-section="followingMe" data-filter="ok" aria-pressed="false">OK</button>
          <button type="button" data-section="followingMe" data-filter="x" aria-pressed="false">X</button>
        </div>
        <button id="open-following-me" class="open-all" type="button">Abrir todos</button>
      </div>
      <ul id="following-me" class="people"></ul>

      <h2>SBCLs que não me seguem <span id="count-not-following-me" class="count"></span></h2>
      <div class="toolbar">
        <div class="filters" role="group" aria-label="Filtrar">
          <button type="button" data-section="notFollowingMe" data-filter="all" aria-pressed="true">Todos</button>
          <button type="button" data-section="notFollowingMe" data-filter="ok" aria-pressed="false">OK</button>
          <button type="button" data-section="notFollowingMe" data-filter="x" aria-pressed="false">X</button>
        </div>
        <button id="open-not-following-me" class="open-all" type="button">Abrir todos</button>
      </div>
      <ul id="not-following-me" class="people"></ul>

      <p id="legend">OK = você já segue &nbsp;·&nbsp; X = você ainda não segue</p>
      <p id="warnings"></p>
    </section>

    <script type="module" src="popup.js"></script>
  </body>
</html>
